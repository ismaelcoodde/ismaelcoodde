<svg xmlns="http://www.w3.org/2000/svg" width="700" height="60" viewBox="0 0 700 60" role="img" aria-label="Hola a todos, soy Ismael Cruz">
  <defs>
    <linearGradient id="blancoRojo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="60">
        <animate attributeName="width" values="0;700;700" keyTimes="0;0.55;1" dur="5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .titulo {
      font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
      font-size: 32px;
      font-weight: 700;
      fill: url(#blancoRojo);
    }
    .cursor {
      animation: blink 1s steps(1) infinite;
      fill: #EF4444;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <text class="titulo" x="350" y="42" text-anchor="middle" clip-path="url(#reveal)">Hola a todos 👋, Soy Ismael Cruz<tspan class="cursor">|</tspan></text>
</svg>
